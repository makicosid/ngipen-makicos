<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D9232E">
  <title>NGIPEN - Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f8;color:#242424;font-family:Arial,sans-serif;text-align:center}
    main{max-width:420px}img{width:88px;height:88px;object-fit:contain}h1{margin:20px 0 8px;font-size:26px}p{color:#666;line-height:1.6}button{margin-top:16px;padding:12px 22px;border:0;border-radius:10px;background:#d9232e;color:white;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="NGIPEN">
    <h1>Kamu sedang offline</h1>
    <p>Koneksi internet belum tersedia. Periksa koneksi lalu coba muat ulang halaman NGIPEN.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
